<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mental Madness - Estoque</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">

    <div class="navbar">
      <div class="brand">
        <img class="logo" src="/logo.png" alt="Mental Madness">
        Mental Madness
        <span class="tag">Painel de estoque</span>
      </div>
      <div class="navactions">
        <button class="bell" aria-label="Alertas de estoque">
          <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          <span class="badge zero" id="bell-count">0</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="statgrid">
        <div class="statcell is-danger">
          <div class="lbl">Peças a produzir</div>
          <div class="num" id="kpi-produzir">–</div>
        </div>
        <div class="statcell">
          <div class="lbl">Pedidos não processados</div>
          <div class="num" id="kpi-pedidos">–</div>
        </div>
        <div class="statcell">
          <div class="lbl">SKUs afetados</div>
          <div class="num" id="kpi-skus">–</div>
        </div>
      </div>
    </div>

    <div id="groups">
      <div class="loading">carregando produção…</div>
    </div>

  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
