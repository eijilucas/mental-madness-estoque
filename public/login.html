<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mental Madness - Estoque</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="loginwrap">
    <form class="loginbox" id="login-form">
      <img class="logo" src="/logo.png" alt="Mental Madness">
      <h1>Mental Madness</h1>
      <span class="tag">Painel de estoque</span>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="btn">Entrar</button>
      <div class="loginerror" id="login-error"></div>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
